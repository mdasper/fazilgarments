<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Red Circle Arc Gradient -->
    <linearGradient id="redFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA1E24" />
      <stop offset="50%" stop-color="#931A1F" />
      <stop offset="100%" stop-color="#7B1216" />
    </linearGradient>

    <!-- Brown F Gradient -->
    <linearGradient id="brownFGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78442A" />
      <stop offset="60%" stop-color="#673921" />
      <stop offset="100%" stop-color="#4F2A16" />
    </linearGradient>

    <!-- Blue g Gradient -->
    <linearGradient id="blueGGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D52C8" />
      <stop offset="60%" stop-color="#203EA0" />
      <stop offset="100%" stop-color="#142B78" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. Top Red Circular Arc with tapered swoosh inner curve -->
    <path d="M 138, 188 
             C 142, 130, 215, 82, 310, 82 
             C 382, 82, 412, 118, 428, 188" 
          fill="none" 
          stroke="url(#redFrameGrad)" 
          stroke-width="22" 
          stroke-linecap="round" />
    <!-- Tapered inner accent curve on top arc -->
    <path d="M 165, 138 
             C 210, 104, 275, 96, 345, 108" 
          fill="none" 
          stroke="url(#redFrameGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- 2. Bottom Red Circular Arc with tapered swoosh inner curve -->
    <path d="M 138, 340 
             C 152, 412, 222, 442, 295, 442 
             C 375, 442, 415, 410, 428, 340" 
          fill="none" 
          stroke="url(#redFrameGrad)" 
          stroke-width="22" 
          stroke-linecap="round" />
    <path d="M 165, 390 
             C 220, 424, 290, 428, 355, 410" 
          fill="none" 
          stroke="url(#redFrameGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- 3. Brown Cursive 'F' Monogram -->
    <!-- Calligraphic flourish stem ending in dot at bottom-left -->
    <path d="M 112, 312 
             C 102, 312, 94, 302, 98, 288 
             C 106, 260, 142, 235, 178, 208 
             C 218, 178, 255, 134, 305, 130 
             C 345, 126, 368, 136, 370, 154 
             C 372, 170, 350, 180, 320, 178 
             C 250, 172, 215, 210, 188, 265 
             C 158, 322, 126, 388, 148, 400 
             C 162, 408, 192, 396, 230, 380" 
          fill="none" 
          stroke="url(#brownFGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'F' Bottom Left Dot Flourish -->
    <circle cx="104" cy="300" r="14" fill="url(#brownFGrad)" />

    <!-- 'F' Horizontal Crossbar -->
    <path d="M 210, 256 L 285, 256" 
          fill="none" 
          stroke="url(#brownFGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- 4. Royal Blue Cursive 'g' Monogram -->
    <path d="M 265, 328
             C 248, 328, 235, 352, 235, 376
             C 235, 405, 260, 424, 295, 424
             C 340, 424, 390, 378, 400, 300
             C 408, 226, 368, 212, 315, 238
             C 268, 262, 258, 312, 288, 342
             C 318, 370, 375, 350, 388, 314
             C 400, 280, 360, 410, 308, 458
             C 272, 490, 235, 498, 222, 472
             C 215, 450, 226, 422, 248, 418" 
          fill="none" 
          stroke="url(#blueGGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'g' Tail Bottom Dot Flourish -->
    <circle cx="230" cy="425" r="13" fill="url(#blueGGrad)" />
  </g>
</svg>
