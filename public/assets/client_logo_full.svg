<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Red Circle Arc Gradient -->
    <linearGradient id="fullRedFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA1E24" />
      <stop offset="50%" stop-color="#931A1F" />
      <stop offset="100%" stop-color="#7B1216" />
    </linearGradient>

    <!-- Brown F Gradient -->
    <linearGradient id="fullBrownFGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78442A" />
      <stop offset="60%" stop-color="#673921" />
      <stop offset="100%" stop-color="#4F2A16" />
    </linearGradient>

    <!-- Blue g Gradient -->
    <linearGradient id="fullBlueGGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D52C8" />
      <stop offset="60%" stop-color="#203EA0" />
      <stop offset="100%" stop-color="#142B78" />
    </linearGradient>

    <filter id="fullLogoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Playfair+Display:ital,wght@0,500;1,400&amp;display=swap');
      .brand-title-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: #22262E;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .brand-motto-text {
        font-family: 'Playfair Display', serif;
        font-weight: 500;
        font-size: 24px;
        fill: #4B5563;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g filter="url(#fullLogoShadow)">
    <!-- Centered Logo Icon -->
    <g transform="translate(200, 20) scale(0.65)">
      <!-- Top Red Arc -->
      <path d="M 138, 188 
               C 142, 130, 215, 82, 310, 82 
               C 382, 82, 412, 118, 428, 188" 
            fill="none" 
            stroke="url(#fullRedFrameGrad)" 
            stroke-width="22" 
            stroke-linecap="round" />
      <path d="M 165, 138 
               C 210, 104, 275, 96, 345, 108" 
            fill="none" 
            stroke="url(#fullRedFrameGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            opacity="0.85" />

      <!-- Bottom Red Arc -->
      <path d="M 138, 340 
               C 152, 412, 222, 442, 295, 442 
               C 375, 442, 415, 410, 428, 340" 
            fill="none" 
            stroke="url(#fullRedFrameGrad)" 
            stroke-width="22" 
            stroke-linecap="round" />
      <path d="M 165, 390 
               C 220, 424, 290, 428, 355, 410" 
            fill="none" 
            stroke="url(#fullRedFrameGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            opacity="0.85" />

      <!-- Brown F -->
      <path d="M 112, 312 
               C 102, 312, 94, 302, 98, 288 
               C 106, 260, 142, 235, 178, 208 
               C 218, 178, 255, 134, 305, 130 
               C 345, 126, 368, 136, 370, 154 
               C 372, 170, 350, 180, 320, 178 
               C 250, 172, 215, 210, 188, 265 
               C 158, 322, 126, 388, 148, 400 
               C 162, 408, 192, 396, 230, 380" 
            fill="none" 
            stroke="url(#fullBrownFGrad)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <circle cx="104" cy="300" r="14" fill="url(#fullBrownFGrad)" />
      <path d="M 210, 256 L 285, 256" 
            fill="none" 
            stroke="url(#fullBrownFGrad)" 
            stroke-width="16" 
            stroke-linecap="round" />

      <!-- Blue g -->
      <path d="M 265, 328
               C 248, 328, 235, 352, 235, 376
               C 235, 405, 260, 424, 295, 424
               C 340, 424, 390, 378, 400, 300
               C 408, 226, 368, 212, 315, 238
               C 268, 262, 258, 312, 288, 342
               C 318, 370, 375, 350, 388, 314
               C 400, 280, 360, 410, 308, 458
               C 272, 490, 235, 498, 222, 472
               C 215, 450, 226, 422, 248, 418" 
            fill="none" 
            stroke="url(#fullBlueGGrad)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <circle cx="230" cy="425" r="13" fill="url(#fullBlueGGrad)" />
    </g>

    <!-- Typography -->
    <text x="500" y="475" class="brand-title-text">FAZIL GARMENTS AND TEXTILES</text>
    <text x="500" y="540" class="brand-motto-text">Quality • Craftsmanship • Trust</text>
  </g>
</svg>
